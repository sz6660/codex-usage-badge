name: Research original Windows entry without restart
on:
  push:
    branches: [research/windows-original-entry]
    paths: ['.github/workflows/startup-research.yml', 'scripts/research/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-entry:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            arch: x64
          - os: windows-11-arm
            arch: arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python build.py
      - name: Install official package and exercise registered application entry
        shell: powershell
        run: ./scripts/research/windows-original-entry.ps1 -Architecture '${{ matrix.arch }}'
      - name: Upload research evidence (no app binaries or account profiles)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: original-entry-${{ matrix.os }}-${{ github.sha }}
          path: research-output/
          if-no-files-found: warn
          retention-days: 14
